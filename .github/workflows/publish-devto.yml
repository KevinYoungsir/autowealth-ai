name: Publish Dev.to

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing public GitHub Release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to authorize the external publication"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish release notes to Dev.to
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the requested public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release_tag must match strict SemVer form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_JSON"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false
             and (.html_url | type == "string" and length > 0)' \
            "$RELEASE_JSON" > /dev/null

      - name: Build the Dev.to payload from Release JSON
        run: |
          set -euo pipefail
          jq --arg repository "https://github.com/KevinYoungsir/autowealth-ai" '
            {
              article: {
                title: ("AutoWealth " + .tag_name + " release notes"),
                body_markdown: (
                  "# AutoWealth " + .tag_name + "\n\n"
                  + (.body // "Release notes are available on GitHub.")
                  + "\n\n## Installation\n\n"
                  + "Download the wheel from the GitHub Release, or clone the repository "
                  + "and run \u0060pip install .\u0060.\n\n"
                  + "Repository: " + $repository + "\n\n"
                  + "This project is for research and educational use only and does not "
                  + "constitute investment advice."
                ),
                published: true,
                series: "AutoWealth Releases",
                tags: ["python", "opensource", "finance"],
                canonical_url: .html_url
              }
            }
          ' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/devto-payload.json"
          jq -e '.article.body_markdown | type == "string" and length > 0' \
            "$RUNNER_TEMP/devto-payload.json" > /dev/null

      - name: Publish to Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVTO_API_KEY:-}" ]]; then
            echo "DEVTO_API_KEY is not configured." >&2
            exit 1
          fi
          HTTP_CODE="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/devto-response.json" \
              --write-out "%{http_code}" \
              --request POST \
              --header "api-key: ${DEVTO_API_KEY}" \
              --header "Content-Type: application/json" \
              --data-binary "@$RUNNER_TEMP/devto-payload.json" \
              "https://dev.to/api/articles"
          )"
          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" ]]; then
            echo "Dev.to publication failed with HTTP status $HTTP_CODE." >&2
            exit 1
          fi
          echo "Dev.to publication completed for ${{ inputs.release_tag }}."
