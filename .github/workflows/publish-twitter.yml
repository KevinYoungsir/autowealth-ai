name: Publish Twitter

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing public GitHub Release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to authorize the external publication"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish release summary to Twitter
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the requested public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release_tag must match strict SemVer form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_JSON"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false
             and (.html_url | type == "string" and length > 0)' \
            "$RELEASE_JSON" > /dev/null

      - name: Build the tweet payload from Release JSON
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          PAYLOAD_JSON="$RUNNER_TEMP/twitter-payload.json"
          jq '
            ((.body // "" | split("\n") | map(select(length > 0)) | .[0] // "")[0:120])
              as $summary
            | {
                text: (
                  "AutoWealth " + .tag_name + " is available."
                  + (if $summary == "" then "" else "\n\n" + $summary end)
                  + "\n\n" + .html_url
                )[0:280]
              }
          ' "$RELEASE_JSON" > "$PAYLOAD_JSON"
          jq -e '.text | type == "string" and length > 0 and length <= 280' \
            "$PAYLOAD_JSON" > /dev/null

      - name: Publish the tweet
        env:
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TWITTER_ACCESS_TOKEN:-}" ]]; then
            echo "TWITTER_ACCESS_TOKEN is not configured." >&2
            exit 1
          fi
          HTTP_CODE="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/twitter-response.json" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${TWITTER_ACCESS_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary "@$RUNNER_TEMP/twitter-payload.json" \
              "https://api.twitter.com/2/tweets"
          )"
          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" ]]; then
            echo "Twitter publication failed with HTTP status $HTTP_CODE." >&2
            exit 1
          fi
          echo "Twitter publication completed for ${{ inputs.release_tag }}."
