name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUTOWEALTH_RUN_REAL_DATA_SMOKE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development and API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"
      - name: Check Python formatting
        run: |
          python -m black --check --line-length 100 \
            autowealth \
            tests \
            scripts/verify_release_metadata.py
      - name: Compile Python sources
        run: python -m compileall -q autowealth tests scripts
      - name: Verify release metadata
        run: python scripts/verify_release_metadata.py --expected-version 0.17.0
      - name: Test release metadata validation
        run: |
          python -m pytest tests/test_release_metadata.py \
            -q \
            --basetemp "${{ runner.temp }}/pytest-release-metadata" \
            -p no:cacheprovider
      - name: Run complete offline test suite
        run: |
          python -m pytest \
            -m "not integration" \
            -q \
            --basetemp "${{ runner.temp }}/pytest-autowealth" \
            -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build research API image
        run: docker build -f Dockerfile.api -t autowealth-api:test .
