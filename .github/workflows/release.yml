name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  verify:
    name: Verify tag and release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag, main ancestry, version, and CHANGELOG
        id: metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must match strict SemVer form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG"
          if [[ "$(git cat-file -t "$TAG")" != "tag" ]]; then
            echo "Release tag must be an annotated tag." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "origin/main is unavailable in the release checkout." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if [[ -z "$TAG_COMMIT" ]]; then
            echo "Unable to resolve the release tag commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "The tag commit is not in origin/main history." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend release gates
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUTOWEALTH_RUN_REAL_DATA_SMOKE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development and API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"
      - name: Check Python formatting
        run: |
          python -m black --check --line-length 100 \
            autowealth \
            tests \
            scripts/verify_release_metadata.py
      - name: Compile Python sources
        run: python -m compileall -q autowealth tests scripts
      - name: Verify release metadata
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG"
      - name: Run complete offline test suite
        run: |
          python -m pytest \
            -m "not integration" \
            -q \
            --basetemp "${{ runner.temp }}/pytest-autowealth" \
            -p no:cacheprovider

  frontend:
    name: Frontend release gates
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker build validation
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build research API image
        run: docker build -f Dockerfile.api -t autowealth-api:release-validation .

  package:
    name: Build and validate Python package
    needs:
      - verify
      - backend
      - frontend
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate package metadata and artifact versions
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m twine check dist/*
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG" \
            --dist-dir dist
      - name: Preserve validated Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ needs.verify.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - verify
      - backend
      - frontend
      - docker
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download validated Python package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist-${{ needs.verify.outputs.version }}
          path: dist
      - name: Revalidate artifacts and extract exact release notes
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG" \
            --dist-dir dist \
            --output-release-notes "$RUNNER_TEMP/release_notes.md"
      - name: Create GitHub Release as the final write operation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "AutoWealth $TAG" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            dist/*.whl \
            dist/*.tar.gz
