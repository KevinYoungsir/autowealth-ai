name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  verify:
    name: Verify tag and release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify tag, main HEAD, version, and CHANGELOG
        id: metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must match strict SemVer form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG"
          VERIFIED_TAG_REF="refs/release-tags/$TAG"
          git fetch --no-tags origin \
            "+refs/tags/$TAG:$VERIFIED_TAG_REF" \
            "+refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git cat-file -t "$VERIFIED_TAG_REF")" != "tag" ]]; then
            echo "Remote release tag must be an annotated tag." >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "$VERIFIED_TAG_REF^{commit}")"
          MAIN_COMMIT="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if [[ "$TAG_COMMIT" != "$MAIN_COMMIT" ]]; then
            echo "Tag commit $TAG_COMMIT does not equal origin/main HEAD $MAIN_COMMIT." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend release gates
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AUTOWEALTH_RUN_REAL_DATA_SMOKE: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development and API dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"
      - name: Check Python formatting
        run: |
          set -euo pipefail
          python -m black --check --line-length 100 \
            autowealth \
            tests \
            scripts/verify_release_metadata.py
      - name: Compile Python sources
        run: python -m compileall -q autowealth tests scripts
      - name: Verify release metadata
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG"
      - name: Run complete offline test suite
        run: |
          set -euo pipefail
          python -m pytest \
            -m "not integration" \
            -q \
            --basetemp "${{ runner.temp }}/pytest-autowealth" \
            -p no:cacheprovider

  frontend:
    name: Frontend release gates
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  docker:
    name: Docker build validation
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build research API image
        run: docker build -f Dockerfile.api -t autowealth-api:release-validation .

  package:
    name: Build and validate Python package
    needs:
      - verify
      - backend
      - frontend
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package build tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Reset package output directory
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - name: Validate package metadata and artifact versions
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG" \
            --dist-dir dist
          mapfile -t WHEELS < <(
            find dist -maxdepth 1 -type f -name '*.whl' -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t SDISTS < <(
            find dist -maxdepth 1 -type f -name '*.tar.gz' -printf '%f\n' | LC_ALL=C sort
          )
          python -m twine check "dist/${WHEELS[0]}" "dist/${SDISTS[0]}"
      - name: Generate and verify deterministic SHA-256 checksums
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t PACKAGE_FILES < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.whl' -o -name '*.tar.gz' \) \
              -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${#PACKAGE_FILES[@]}" -ne 2 ]]; then
            echo "Expected exactly two Python package files before checksum generation." >&2
            exit 1
          fi
          (
            cd dist
            : > SHA256SUMS.txt
            for FILE in "${PACKAGE_FILES[@]}"; do
              sha256sum "$FILE" >> SHA256SUMS.txt
            done
            sha256sum -c SHA256SUMS.txt
          )
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG" \
            --dist-dir dist
      - name: Preserve validated Python package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist-${{ needs.verify.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create, validate, and publish draft GitHub Release
    needs:
      - verify
      - backend
      - frontend
      - docker
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download validated Python package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist-${{ needs.verify.outputs.version }}
          path: dist
      - name: Revalidate artifacts and extract exact release notes
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/verify_release_metadata.py \
            --expected-version "$VERSION" \
            --tag "$TAG" \
            --dist-dir dist \
            --output-release-notes "$RUNNER_TEMP/release_notes.md"
          (
            cd dist
            sha256sum -c SHA256SUMS.txt
          )
      - name: Create or resume the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_PAGES="$RUNNER_TEMP/release-pages.json"
          MATCHING_RELEASES="$RUNNER_TEMP/matching-releases.json"
          RELEASE_JSON="$RUNNER_TEMP/release-before-upload.json"

          list_matching_releases() {
            gh api \
              --paginate \
              --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASE_PAGES"
            jq --arg tag "$TAG" \
              '[.[][] | select(.tag_name == $tag)]' \
              "$RELEASE_PAGES" > "$MATCHING_RELEASES"
          }

          list_matching_releases
          MATCH_COUNT="$(jq -r 'length' "$MATCHING_RELEASES")"
          if [[ "$MATCH_COUNT" -gt 1 ]]; then
            echo "Multiple Releases exist for $TAG; refusing to choose one." >&2
            exit 1
          fi
          if [[ "$MATCH_COUNT" -eq 0 ]]; then
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "AutoWealth $TAG" \
              --notes-file "$RUNNER_TEMP/release_notes.md"

            list_matching_releases
            MATCH_COUNT="$(jq -r 'length' "$MATCHING_RELEASES")"
          fi
          if [[ "$MATCH_COUNT" -ne 1 ]]; then
            echo "Expected exactly one Release for $TAG after discovery; found $MATCH_COUNT." >&2
            exit 1
          fi

          jq '.[0]' "$MATCHING_RELEASES" > "$RELEASE_JSON"
          if ! jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .draft == true and .prerelease == false
             and (.id | type == "number" and . > 0 and floor == .)' \
            "$RELEASE_JSON" > /dev/null; then
            echo "A non-draft or inconsistent Release already exists for $TAG." >&2
            exit 1
          fi
          RELEASE_ID="$(jq -r '.id' "$RELEASE_JSON")"
          if [[ ! "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release ID must be a positive integer." >&2
            exit 1
          fi
          echo "Using draft Release ID $RELEASE_ID for $TAG."
          gh release edit "$TAG" \
            --draft \
            --title "AutoWealth $TAG" \
            --notes-file "$RUNNER_TEMP/release_notes.md"

      - name: Upload only the three expected draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t WHEELS < <(
            find dist -maxdepth 1 -type f -name '*.whl' -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t SDISTS < <(
            find dist -maxdepth 1 -type f -name '*.tar.gz' -printf '%f\n' | LC_ALL=C sort
          )
          if [[ "${#WHEELS[@]}" -ne 1 || "${#SDISTS[@]}" -ne 1 ]]; then
            echo "The Release job requires exactly one wheel and one sdist." >&2
            exit 1
          fi
          gh release upload "$TAG" \
            "dist/${WHEELS[0]}" \
            "dist/${SDISTS[0]}" \
            "dist/SHA256SUMS.txt" \
            --clobber

      - name: Verify the draft asset set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$RUNNER_TEMP/release-after-upload.json"
          EXPECTED_ASSETS="$RUNNER_TEMP/expected-assets.txt"
          ACTUAL_ASSETS="$RUNNER_TEMP/actual-assets.txt"
          gh release view "$TAG" \
            --json tagName,isDraft,isPrerelease,assets > "$RELEASE_JSON"
          jq -e --arg tag "$TAG" \
            '.tagName == $tag and .isDraft == true and .isPrerelease == false
             and (.assets | length == 3)' \
            "$RELEASE_JSON" > /dev/null
          find dist -maxdepth 1 -type f \
            \( -name '*.whl' -o -name '*.tar.gz' -o -name 'SHA256SUMS.txt' \) \
            -printf '%f\n' | LC_ALL=C sort > "$EXPECTED_ASSETS"
          jq -r '.assets[].name' "$RELEASE_JSON" | LC_ALL=C sort > "$ACTUAL_ASSETS"
          test "$(wc -l < "$EXPECTED_ASSETS")" -eq 3
          diff -u "$EXPECTED_ASSETS" "$ACTUAL_ASSETS"

      - name: Publish only after draft validation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          RELEASE_JSON="$RUNNER_TEMP/release-published.json"
          gh release view "$TAG" \
            --json tagName,isDraft,isPrerelease,assets > "$RELEASE_JSON"
          jq -e --arg tag "$TAG" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false
             and (.assets | length == 3)' \
            "$RELEASE_JSON" > /dev/null
