name: Community Notify

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing public GitHub Release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to authorize the external notification"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Send release notification to configured community webhooks
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the requested public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release_tag must match strict SemVer form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_JSON"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false
             and (.html_url | type == "string" and length > 0)' \
            "$RELEASE_JSON" > /dev/null

      - name: Build webhook payloads from Release JSON
        run: |
          set -euo pipefail
          jq --arg repository "https://github.com/KevinYoungsir/autowealth-ai" '
            {
              username: "AutoWealth Release Bot",
              embeds: [
                {
                  title: ("AutoWealth " + .tag_name + " is available"),
                  description: (
                    ((.body // "Release notes are available on GitHub.")[0:1000])
                    + "\n\nRepository: " + $repository
                  ),
                  url: .html_url
                }
              ]
            }
          ' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/discord-payload.json"
          jq --arg repository "https://github.com/KevinYoungsir/autowealth-ai" '
            {
              text: ("AutoWealth " + .tag_name + " is available: " + .html_url),
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: (
                      "*AutoWealth " + .tag_name + " is available*\n"
                      + "<" + .html_url + "|View the public GitHub Release>\n"
                      + "<" + $repository + "|Repository>"
                    )
                  }
                }
              ]
            }
          ' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/slack-payload.json"

      - name: Send configured community notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" && -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "No community webhook is configured." >&2
            exit 1
          fi

          if [[ -n "${DISCORD_WEBHOOK_URL:-}" ]]; then
            HTTP_CODE="$(
              curl --silent --show-error \
                --output "$RUNNER_TEMP/discord-response.txt" \
                --write-out "%{http_code}" \
                --header "Content-Type: application/json" \
                --data-binary "@$RUNNER_TEMP/discord-payload.json" \
                "$DISCORD_WEBHOOK_URL"
            )"
            if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "204" ]]; then
              echo "Discord notification failed with HTTP status $HTTP_CODE." >&2
              exit 1
            fi
            echo "Discord notification completed."
          fi

          if [[ -n "${SLACK_WEBHOOK_URL:-}" ]]; then
            HTTP_CODE="$(
              curl --silent --show-error \
                --output "$RUNNER_TEMP/slack-response.txt" \
                --write-out "%{http_code}" \
                --header "Content-Type: application/json" \
                --data-binary "@$RUNNER_TEMP/slack-payload.json" \
                "$SLACK_WEBHOOK_URL"
            )"
            if [[ "$HTTP_CODE" != "200" ]]; then
              echo "Slack notification failed with HTTP status $HTTP_CODE." >&2
              exit 1
            fi
            echo "Slack notification completed."
          fi
